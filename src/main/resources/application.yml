    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/benblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 13579@Lym

  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password: 123456

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto


minio:
  endpoint: http://127.0.0.1:9000  # 修改你的 MinIO 端点
  accessKey: minioadmin # 修改你的 MinIO Access Key
  secretKey: minioadmin # 修改你的 MinIO Secret Key
  bucket: ben-blog-data # 确认 Bucket 名称与你创建的一致


