<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>benleung Dashboard</title>
    <link rel="stylesheet" href="css/glass.css">
    <style>
        body{
            padding: 30px;
        }
        .container{
            display: grid;
            grid-template-columns: 240px 1fr 280px;
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
            padding: 0;
        }
        /* ========== 左侧侧边栏 ========== */
        .sidebar{
            grid-row: span 2;
        }
        .profile-top{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
        }
        .avatar-small{
            width:40px;
            height:40px;
            border-radius:50%;
            background:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
        }
        .sidebar-auth{
            display:flex;
            flex-direction:column;
            gap:10px;
            margin-bottom:18px;
        }
        .auth-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:11px 12px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.6);
            background:rgba(255,255,255,0.5);
            color:#24967c;
            font-size:14px;
            cursor:pointer;
            text-decoration:none;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .auth-btn:hover{
            transform: translateY(-3px);
            background:rgba(255,255,255,0.75);
        }
        .nav-item{
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 10px;
            margin:8px 0;
            border-radius:14px;
            cursor:pointer;
            transition:0.2s ease;
            color:inherit;
            text-decoration:none;
        }
        .nav-item.active{
            background:rgba(255,255,255,0.7);
        }
        .nav-item:hover{
            background:rgba(255,255,255,0.6);
            transform: translateX(4px);
        }
        /* ========== 中间主区域 ========== */
        .main-col{
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        .top-gallery{
            height: 200px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:8px;
            color:#888;
            cursor:pointer;
        }
        .top-gallery .sub{
            font-size: 13px;
            color: #24967c;
        }
        .greeting-card{
            text-align:center;
        }
        .greeting-avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background-color: #fff8bc;
            margin: 0 auto 16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size: 50px;
        }
        .greeting-card h2{
            font-weight: 500;
            color:#333;
        }
        .greeting-card p{
            font-size:22px;
            margin-top: 8px;
            color:#24967c;
        }
        .social-row{
            display:flex;
            gap:12px;
            margin-top: 24px;
            justify-content:center;
        }
        .social-btn{
            padding: 8px 16px;
            border-radius: 12px;
            background:rgba(255,255,255,0.55);
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:6px;
            transition: transform 0.2s ease,background 0.2s ease;
        }
        .social-btn:hover{
            transform: translateY(-3px);
            background:rgba(255,255,255,0.75);
        }
        .bottom-row-middle{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        /* ========== 右侧区域 ========== */
        .right-col{
            display:flex;
            flex-direction:column;
            gap: 20px;
        }
        .clock-card{
            text-align:center;
            font-size:64px;
            color:#555;
            font-weight: 300;
        }
        .calendar-card{
        }
        .calendar-header{
            margin-bottom: 12px;
            color:#555;
        }
        .calendar-week{
            display:grid;
            grid-template-columns: repeat(7, 1fr);
            gap:4px;
            margin-bottom:8px;
        }
        .calendar-day{
            text-align:center;
            padding:6px 0;
            border-radius: 8px;
            font-size:14px;
        }
        .calendar-day.today{
            background-color:#40c9a2;
            color:white;
        }
        /* 音乐播放器 */
        .music-card{
            display:flex;
            align-items:center;
            gap: 12px;
        }
        .play-button{
            width:40px;
            height:40px;
            border-radius: 50%;
            background-color:#40c9a2;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition: transform 0.2s ease;
        }
        .play-button:hover{
            transform: scale(1.12);
        }
        @media (max-width: 1000px) {
            .container{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <div class="glass-card sidebar">
            <div class="profile-top">
                <div class="avatar-small">🐱</div>
                <div>
                    <h3>benleung</h3>
                    <span style="font-size: 12px; color:#777">(开发中)</span>
                </div>
            </div>
            <!-- 登录 / 注册 或 管理 / 退出（按登录状态渲染） -->
            <div class="sidebar-auth" id="sidebarAuth"></div>
            <div style="font-size: 13px; color:#777; margin-bottom:10px">GENERAL</div>
            <a class="nav-item active" href="index.html">📄 近期文章</a>
        </div>
        <!-- 中间列 -->
        <div class="main-col">
            <a class="glass-card top-gallery" href="pictureFront.html" style="text-decoration:none;color:inherit">
                <span style="font-size: 46px;">🖼️</span>
                <span>照片卡片区域</span>
                <span class="sub">点击进入照片墙 →</span>
            </a>
            <div class="glass-card greeting-card">
                <div class="greeting-avatar">🐱</div>
                <h2>Good Afternoon</h2>
                <p>I'm benleung , Nice to meet you!</p>
                <div class="social-row">
                    <a class="social-btn" href="https://github.com/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Github</a>
                </div>
            </div>
            <div class="bottom-row-middle">
                <div class="glass-card">
                    <div style="font-size: 14px; color:#777; margin-bottom: 10px;">最新文章</div>
                    <div>暂无</div>
                    <div style="font-size: 13px; color:#888; margin-top: 6px;">2026/7/28</div>
                </div>
                <div class="glass-card">
                    <div style="font-size: 14px; color:#777; margin-bottom: 10px;">随机推荐</div>
                    <div>暂无</div>
                </div>
            </div>
        </div>
        <!-- 右侧列 -->
        <div class="right-col">
            <div class="glass-card clock-card" id="clock">12:27</div>
            <div class="glass-card calendar-card">
                <div class="calendar-header" id="calendar-header">2026/8/18 周二</div>
                <div class="calendar-week">
                    <div class="calendar-day">一</div>
                    <div class="calendar-day">二</div>
                    <div class="calendar-day">三</div>
                    <div class="calendar-day">四</div>
                    <div class="calendar-day">五</div>
                    <div class="calendar-day">六</div>
                    <div class="calendar-day">日</div>
                </div>
                <div class="calendar-week" id="calendar-body"></div>
            </div>
            <div class="glass-card music-card">
                <span>🎵 Close To You</span>
                <div class="play-button">▶</div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        // 根据登录状态渲染侧边栏的登录/注册/管理按钮
        function renderSidebarAuth() {
            const box = document.getElementById('sidebarAuth');
            if (!box) return;
            const token = getToken();
            const role = getRole();
            let html = '';
            if (token) {
                if (role === 1) html += '<a class="auth-btn" href="admin.html">⚙️ 管理面板</a>';
                html += '<button class="auth-btn" onclick="logout()">退出登录</button>';
            } else {
                html += '<a class="auth-btn" href="login.html">登录 / 注册</a>';
            }
            box.innerHTML = html;
        }
        renderSidebarAuth();

        // 实时时钟
        function updateClock(){
            const now = new Date();
            let h = String(now.getHours()).padStart(2,'0');
            let m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById("clock").innerText = `${h}:${m}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 动态日历：渲染当前月份的日历格
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDay = new Date(year, month, 1).getDay(); // 0=周日
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weekDays = ['日','一','二','三','四','五','六'];
            document.getElementById('calendar-header').textContent = `${year}/${month + 1}  ${weekDays[now.getDay()]}`;
            let cells = '';
            for (let i = 0; i < firstDay; i++) cells += '<div class="calendar-day"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                cells += `<div class="calendar-day${d === today ? ' today' : ''}">${d}</div>`;
            }
            document.getElementById('calendar-body').innerHTML = cells;
        }
        renderCalendar();
    </script>
</body>
</html>
